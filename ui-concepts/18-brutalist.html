<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>18 · 粗野主义</title>
<style>
:root{--white:#FFFFFF;--black:#000000;--yellow:#FFD500;--gray:#D9D9D9;--text:#111}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial Black,Arial,"Microsoft YaHei",sans-serif;background:var(--white);color:var(--black);height:100vh;display:flex;align-items:center;justify-content:center}
.desktop{width:1180px;height:760px;background:var(--white);border:5px solid var(--black);display:flex;flex-direction:column;box-shadow:16px 16px 0 var(--black)}
.titlebar{height:56px;border-bottom:5px solid var(--black);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:22px;font-weight:900;letter-spacing:1px;background:var(--yellow)}
.titlebar .x{font-size:26px}
.body{flex:1;display:grid;grid-template-columns:230px 1fr;min-height:0}
.side{border-right:5px solid var(--black);padding:16px 10px;display:flex;flex-direction:column}
.logo{font-size:28px;font-weight:900;line-height:1;margin-bottom:20px}
.nav a{display:block;padding:13px 10px;border:4px solid var(--black);margin-bottom:10px;font-size:17px;font-weight:900;text-decoration:none;color:var(--black);background:var(--white);text-transform:uppercase;box-shadow:5px 5px 0 var(--black)}
.nav a.on{background:var(--black);color:var(--white)}
.nav a:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--black)}
.side .big{font-size:44px;font-weight:900;line-height:.95;margin-top:auto;background:var(--yellow);padding:8px}
.main{display:flex;flex-direction:column;min-width:0;padding:16px;gap:16px}
.toolbar{display:flex;align-items:stretch;gap:12px}
.toolbar input{flex:1;max-width:340px;border:4px solid var(--black);padding:0 14px;font-size:18px;font-weight:700;font-family:inherit}
.btn{padding:0 20px;border:4px solid var(--black);background:var(--white);font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;box-shadow:5px 5px 0 var(--black)}
.btn.fill{background:var(--black);color:var(--white)}
.btn.warn{background:var(--yellow)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--black)}
.workspace{flex:1;display:grid;grid-template-columns:300px 1fr;gap:16px;min-height:0}
.flow{border:4px solid var(--black);padding:16px;display:flex;flex-direction:column;overflow:auto}
.flow .head{font-size:15px;font-weight:900;background:var(--black);color:var(--white);padding:8px 10px;margin-bottom:14px;letter-spacing:1px}
.step{border:4px solid var(--black);padding:12px;margin-bottom:10px;font-size:15px;font-weight:700;background:var(--white)}
.step small{display:block;font-size:11px;font-weight:400;margin-top:4px}
.step.on{background:var(--yellow);box-shadow:6px 6px 0 var(--black)}
.arrow{text-align:center;font-size:18px;font-weight:900;margin:-5px 0}
.browser{display:flex;flex-direction:column;border:4px solid var(--black);min-width:0}
.addr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:4px solid var(--black);background:var(--gray)}
.addr .field{flex:1;height:32px;border:3px solid var(--black);background:var(--white);display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700}
.addr .go{padding:6px 14px;border:3px solid var(--black);background:var(--black);color:var(--white);font-weight:900;font-size:14px}
.page{flex:1;padding:24px;overflow:auto}
.page h2{font-size:30px;font-weight:900;letter-spacing:-1px;text-transform:uppercase}
.page .crumb{font-size:13px;font-weight:700;margin:10px 0 22px;text-decoration:underline;text-underline-offset:4px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{border:4px solid var(--black);padding:14px;box-shadow:8px 8px 0 var(--black);background:var(--white)}
.card .p{height:70px;border:3px solid var(--black);background:repeating-linear-gradient(45deg,var(--yellow) 0 14px,var(--white) 14px 28px);margin-bottom:12px}
.card b{font-size:18px}
.card span{display:block;font-size:13px;font-weight:700;margin-top:6px}
.card:nth-child(2){transform:rotate(1deg)}.card:nth-child(3){transform:rotate(-1deg)}
.statusbar{height:34px;border-top:5px solid var(--black);display:flex;align-items:center;gap:20px;padding:0 16px;font-size:14px;font-weight:900}
.sw{display:inline-block;width:14px;height:14px;border:2px solid var(--black);margin-left:4px;vertical-align:middle}
</style>
</head>
<body>
<div class="desktop">
  <div class="titlebar"><span>GLINTREE!!</span><span class="x">✕</span></div>
  <div class="body">
    <aside class="side">
      <div class="logo">GLIN<br>TREE</div>
      <nav class="nav"><a href="#">首页</a><a href="#" class="on">任务编排</a><a href="#">任务管理</a><a href="#">数据查看</a><a href="#">设置</a></nav>
      <div class="big">42%<br>MEM</div>
    </aside>
    <div class="main">
      <div class="toolbar">
        <input value="新品价格采集任务">
        <span style="flex:1"></span>
        <button class="btn">保存</button>
        <button class="btn fill">执行</button>
        <button class="btn warn">设置</button>
      </div>
      <div class="workspace">
        <section class="flow">
          <div class="head">FLOW / 流程</div>
          <div class="step on">打开网页<small>https://www.example.com/list</small></div>
          <div class="arrow">↓</div>
          <div class="step">循环：网址列表<small>共 3 条地址</small></div>
          <div class="arrow">↓</div>
          <div class="step">点击元素<small>A · 商品链接</small></div>
          <div class="arrow">↓</div>
          <div class="step">提取数据<small>字段_1 / 2 / 3</small></div>
        </section>
        <section class="browser">
          <div class="addr"><span>●</span><span class="field">https://www.example.com/list</span><span class="go">GO</span></div>
          <div class="page">
            <h2>商品列表</h2>
            <div class="crumb">首页 / 数码 / 新品</div>
            <div class="cards">
              <div class="card"><div class="p"></div><b>无线降噪耳机</b><span>¥ 899 · 128 条</span></div>
              <div class="card"><div class="p"></div><b>智能手表 Pro</b><span>¥ 1,299 · 86 条</span></div>
              <div class="card"><div class="p"></div><b>便携投影仪</b><span>¥ 2,099 · 54 条</span></div>
            </div>
          </div>
        </section>
      </div>
      <div class="statusbar"><span>任务空闲</span><span>已采集 0 条</span><span style="flex:1"></span><span>令牌：纯黑 <i class="sw" style="background:#000"></i> 纯白 <i class="sw" style="background:#fff"></i> 荧光黄 <i class="sw" style="background:#FFD500"></i> · 无圆角 · 5px 硬边</span></div>
    </div>
  </div>
</div>
</body>
</html>
